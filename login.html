<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaundryPOS - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #2e7d6b;
      --accent3: #1a5c4e;
      --bg: #f0ede8;
      --surface: #faf8f5;
      --border: #ddd8cf;
      --text: #1c1a17;
      --text2: #6b6355;
      --text3: #9d9185;
      --danger: #c0392b;
      --blue: #1d6fa4;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.14);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .login-container {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 48px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text3);
      font-weight: 600;
    }

    .login-section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text3);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .role-selection {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-btn {
      padding: 16px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      text-align: center;
      color: var(--text2);
    }

    .role-btn:hover {
      border-color: var(--accent);
      background: #f5f5f5;
      transform: translateY(-2px);
    }

    .role-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .role-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
    }

    .role-label {
      font-size: 0.72rem;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .login-btn:hover {
      background: var(--accent3);
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
      transform: none;
    }

    .guest-btn {
      width: 100%;
      padding: 10px;
      background: none;
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .guest-btn:hover {
      background: var(--accent);
      color: white;
    }

    .demo-info {
      background: #e3f2fd;
      border-left: 4px solid var(--blue);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--blue);
      margin-top: 16px;
      line-height: 1.5;
    }

    .demo-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .error-msg {
      background: #fee2e2;
      border-left: 4px solid var(--danger);
      color: var(--danger);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 20px;
      }

      .role-selection {
        grid-template-columns: 1fr 1fr;
      }

      .login-header {
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo">LaundryPOS</div>
    <div class="tagline">Kasir Digital untuk Laundry</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="login-section">
    <div class="section-title">📍 Pilih Role Anda</div>
    <div class="role-selection">
      <button class="role-btn active" onclick="selectRole('kasir')">
        <span class="role-icon">🧾</span>
        <span class="role-label">Kasir</span>
      </button>
      <button class="role-btn" onclick="selectRole('kurir')">
        <span class="role-icon">🛵</span>
        <span class="role-label">Kurir</span>
      </button>
      <button class="role-btn" onclick="selectRole('admin')">
        <span class="role-icon">⚙️</span>
        <span class="role-label">Admin</span>
      </button>
    </div>
  </div>

  <div class="login-section" id="loginForm">
    <div class="section-title">🔐 Login</div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Nama Pengguna / Email</label>
        <input type="text" id="username" placeholder="Masukkan username..." required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password..." required>
      </div>
      <button type="submit" class="login-btn">🔓 Login</button>
    </form>
    <button class="guest-btn" onclick="loginAsGuest()">👤 Login sebagai Guest</button>
  </div>

  <div class="demo-info">
    <strong>ℹ️ Demo Credentials:</strong>
    <div>
      <strong>Kasir:</strong> kasir / 123456<br>
      <strong>Kurir:</strong> kurir / 123456<br>
      <strong>Admin:</strong> admin / 123456<br>
      <small style="opacity: 0.8;">Atau login sebagai Guest tanpa password</small>
    </div>
  </div>
</div>

<script>
let selectedRole = 'kasir';

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
  event.target.closest('.role-btn').classList.add('active');
}

function showError(msg) {
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => {
    errorEl.style.display = 'none';
  }, 4000);
}

function handleLogin(event) {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  // Simple validation (demo credentials)
  const credentials = {
    kasir: { username: 'kasir', password: '123456' },
    kurir: { username: 'kurir', password: '123456' },
    admin: { username: 'admin', password: '123456' }
  };

  const cred = credentials[selectedRole];
  if (username === cred.username && password === cred.password) {
    loginUser(username, selectedRole);
  } else {
    showError('❌ Username atau password salah!');
  }
}

function loginAsGuest() {
  loginUser('Guest', selectedRole);
}

function loginUser(username, role) {
  // Simpan session ke localStorage
  localStorage.setItem('lpos_user', JSON.stringify({
    username: username,
    role: role,
    loginTime: new Date().toISOString()
  }));

  // Redirect ke main app
  window.location.href = 'index.html';
}

// Jika sudah login, redirect ke main app
window.addEventListener('load', () => {
  const user = localStorage.getItem('lpos_user');
  if (user) {
    window.location.href = 'index.html';
  }
});
</script>

</body>
</html>
