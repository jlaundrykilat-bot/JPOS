<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaundryPOS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#f0ede8;--surface:#faf8f5;--border:#ddd8cf;
  --accent:#2e7d6b;--accent2:#e8f5f1;--accent3:#1a5c4e;
  --danger:#c0392b;--danger-bg:#fdf2f0;
  --warn:#d97706;--warn-bg:#fffbeb;
  --blue:#1d6fa4;--blue-bg:#e8f2fb;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --text:#1c1a17;--text2:#6b6355;--text3:#9d9185;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.14);
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOGO PREVIEW */
.logo-preview-box{width:100%;height:80px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.logo-preview-box img{max-width:100%;max-height:100%;object-fit:contain}
.logo-upload-btn{width:100%;padding:12px;background:var(--accent2);border:2px dashed var(--accent);border-radius:var(--radius-sm);color:var(--accent);font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .15s;text-align:center;margin-bottom:8px}
.logo-upload-btn:hover{background:var(--accent);color:white}
.logo-clear-btn{width:100%;padding:8px;background:none;border:1.5px solid var(--danger);border-radius:var(--radius-sm);color:var(--danger);font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .15s}
.logo-clear-btn:hover{background:var(--danger-bg)}
#logoFileInput{display:none}

</style>
</head>
<body>

<!-- MODAL OVERLAY -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- PENGATURAN -->
<div id="page-pengaturan" class="page">
  <div class="set-inner">
    <div style="font-family:'DM Serif Display',serif;font-size:1.4rem">⚙️ Pengaturan</div>

    <!-- Info Toko -->
    <div class="set-section">
      <div class="set-section-title">🏪 Informasi Toko</div>
      <div class="set-field">
        <label>Logo untuk Nota</label>
        <div class="logo-preview-box" id="logoPreview"></div>
        <button class="logo-upload-btn" onclick="document.getElementById('logoFileInput').click()">📸 Upload Logo</button>
        <input type="file" id="logoFileInput" accept="image/*" onchange="uploadLogo(event)" style="display:none">
        <button class="logo-clear-btn" onclick="clearLogo()">🗑️ Hapus Logo</button>
      </div>
      <div class="set-field">
        <label>Nama Toko</label>
        <input type="text" id="set-nama-toko" placeholder="Laundry Bersih Jaya...">
      </div>
      <div class="set-field">
        <label>Tagline</label>
        <input type="text" id="set-tagline" placeholder="kasir digital">
      </div>
      <div class="set-field">
        <label>No. Rekening (untuk struk)</label>
        <input type="text" id="set-rekening" placeholder="BCA 1234567890 a/n Nama">
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="set-save-btn" onclick="saveToko()">💾 Simpan</button>
        <span class="set-saved" id="tokoSaved">✓ Tersimpan!</span>
      </div>
    </div>

  </div>
</div>

<script src="index.js"></script>
<script src="style.js"></script>
</body>
</html>
